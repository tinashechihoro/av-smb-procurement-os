services:
  postgres:
    image: postgres:16-alpine
    container_name: av-smb-db
    environment:
      POSTGRES_DB: ${DB_NAME:-avsmc_procurement}
      POSTGRES_USER: ${DB_USERNAME:-avsmc_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — see .env.example}
    # Bind to loopback only: the database must not be reachable from outside the host
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-avsmc_admin} -d ${DB_NAME:-avsmc_procurement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - av-smb-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: av-smb-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-avsmc_procurement}
      DB_USERNAME: ${DB_USERNAME:-avsmc_admin}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env — see .env.example}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — generate with: openssl rand -base64 64}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env — production origins only}
      SERVER_PORT: 4000
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SQL: WARN
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - av-smb-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: av-smb-frontend
    ports:
      - "${FRONTEND_PORT:-3080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - av-smb-net

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local

networks:
  av-smb-net:
    driver: bridge
