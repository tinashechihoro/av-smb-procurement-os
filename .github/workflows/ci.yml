name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avsmc_procurement
          POSTGRES_USER: avsmc_admin
          POSTGRES_PASSWORD: avsmc_s3cur3_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avsmc_admin -d avsmc_procurement"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Build & Test
        run: mvn -f backend/pom.xml clean verify -q
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  backend-security:
    # Scan the built JAR rather than resolving POMs: Trivy's jar scanning uses
    # its own Java DB and avoids Maven Central rate limits (429) on runner IPs.
    needs: backend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-jar
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend-jar/'
          severity: 'CRITICAL,HIGH'

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Run Tests
        run: |
          cd frontend
          npm test -- --passWithNoTests

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

  # ── Docker ───────────────────────────────────────────────────────────────
  docker-build:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
      - name: Smoke test
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=ci-smoke-test-password
          JWT_SECRET=ci-smoke-test-jwt-secret-at-least-32-bytes-long
          SEED_ADMIN_PASSWORD=CiSmoke@12345
          EOF
          docker compose up -d
          timeout=120
          until curl -sf http://localhost:4000/api/actuator/health >/dev/null 2>&1; do
            timeout=$((timeout-5))
            if [ $timeout -le 0 ]; then
              docker compose logs backend
              exit 1
            fi
            sleep 5
          done
          curl -sf http://localhost:4000/api/actuator/health
          docker compose down -v

  # ── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    needs: [docker-build, backend-security, frontend-lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: echo "Deploy step — configure with your deployment target"
